# Copy to secrets.yaml (gitignored), fill in the values and apply it by hand:
#   kubectl apply -f k8s/app/secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: gazzetta-secrets
  namespace: gazzetta
type: Opaque
stringData:
  # mix phx.gen.secret
  SECRET_KEY_BASE: <secret key base>
  # openssl rand -hex 24 (hex only: it is embedded in DATABASE_URL)
  DB_PASSWORD: <database password>
  OPENAI_API_KEY: <openai api key>
  # Only needed with SUMMARIZER=claude in configmap.yaml
  ANTHROPIC_API_KEY: ""
